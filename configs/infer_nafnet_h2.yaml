input_dir: ../data/test/NoisyLR
output_dir: outputs/nafnet_h2/test_predictions

checkpoint: auto
train_output_dir: outputs/nafnet_h2

batch_size: 8
num_workers: 4
amp: true
quality_preset: balanced

# Optional model overrides; defaults come from checkpoint args.
