in_channels: 1
scale: 2
upsample_mode: bilinear

h2_a: 0.14160734
h2_b: 0.000063383
student_t_nu: 3.0

refine_steps: null
refine_lr: null
tta: null

write_submission_csv: false
submission_csv_path: ""
verify_all_inputs: true
expected_size: 256
expected_count: -1
